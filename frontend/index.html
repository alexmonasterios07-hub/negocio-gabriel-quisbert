<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Buscador de Pokémon</title>
</head>
<body>
    <h1>Buscador de Pokémon</h1>
<p>Escribe el nombre de un Pokémon para buscarlo.</p>

<input type="text" id="nombrePokemon" placeholder="Ejemplo: pikachu">
<button id="btnBuscar">Buscar</button>

<p id="mensaje"></p>

<section id="resultado">
    <h2 id="nombre"></h2>
    <img id="imagen" alt="Imagen del Pokémon" hidden>
    <p id="tipos"></p>
    <p id="peso"></p>
    <p id="altura"></p>
</section>

<script src="app.js"></script>

</body>
</html>
